{% extends "base.html" %}{% block content %}<h1>Manage study materials</h1><div class="formbox wide"><h2>Upload a resource</h2><form method="post" enctype="multipart/form-data"><label>Title</label><input name="title" required><label>Subject</label><input name="subject" required><label>Semester</label><select name="semester">{% for n in range(1,9) %}<option>{{ n }}</option>{% endfor %}</select><label>Department</label><input name="department" value="CSE" required><label>Material type</label><select name="material_type"><option>Notes</option><option>Previous Year Question Paper</option><option>Assignment</option><option>Practical</option><option>Syllabus</option><option>Presentation</option></select><label>File (PDF, DOC, DOCX, PPT, PPTX)</label><input type="file" name="file" required accept=".pdf,.doc,.docx,.ppt,.pptx"><button>Upload material</button></form></div><h2>Uploaded materials</h2>{% for m in materials %}<article class="card inline"><span><strong>{{ m.title }}</strong> · {{ m.subject }} · Semester {{ m.semester }}</span><form method="post" action="{{ url_for('delete_material',material_id=m.id) }}"><button class="danger">Delete</button></form></article>{% else %}<p>No materials uploaded.</p>{% endfor %}{% endblock %}
