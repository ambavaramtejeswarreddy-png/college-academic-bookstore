{% extends "base.html" %}{% block content %}<h1>Manage books</h1><div class="formbox wide"><h2>Add a book</h2><form method="post"><label>Book title</label><input name="title" required><label>Author</label><input name="author" required><label>Subject</label><input name="subject" required><label>Semester</label><select name="semester">{% for n in range(1,9) %}<option>{{ n }}</option>{% endfor %}</select><label>Department</label><input name="department" value="CSE" required><label>Price (INR)</label><input name="price" type="number" min="0" step="0.01" required><label>Stock</label><input name="stock" type="number" min="0" required><label>Description</label><textarea name="description"></textarea><button>Add book</button></form></div><h2>Current books</h2>{% for b in books %}<article class="card inline"><span><strong>{{ b.title }}</strong> · ₹{{ b.price }} · Stock {{ b.stock }}</span><form method="post" action="{{ url_for('delete_book',book_id=b.id) }}"><button class="danger">Delete</button></form></article>{% endfor %}{% endblock %}
